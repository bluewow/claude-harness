name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository checks
        run: python3 tools/validate.py --strict
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t . -v
      - name: Asset compression check
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 tools/optimize_assets.py --check
